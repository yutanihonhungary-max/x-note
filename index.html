<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>𝕏 - Personal Note</title>
  
  <!-- X風のファビコン -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23000000'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='central' text-anchor='middle' fill='%23ffffff' font-family='sans-serif' font-weight='900' font-size='68'%3E%F0%9D%95%8F%3C/text%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23000000'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='central' text-anchor='middle' fill='%23ffffff' font-family='sans-serif' font-weight='900' font-size='68'%3E%F0%9D%95%8F%3C/text%3E%3C/svg%3E">
  
  <!-- PWA用設定 -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="X-Note">
  
  <!-- Tailwind CSS, Lucide Icons, Marked, X Official Widgets -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script async src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>

  <!-- KaTeX & mhchem（LaTeX数式・化学式レンダリング用） -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/mhchem.min.js"></script>
  
  <style>
    :root {
      --bg-main: #000000;
      --bg-card: #16181c;
      --bg-hover: rgba(255, 255, 255, 0.03);
      --text-main: #e7e9ea;
      --text-sub: #71767b;
      --border-color: #2f3336;
      --accent: #1d9bf0;
      --post-font-size: 15px;
      --post-line-height: 1.65;
      --post-padding: 16px;
      --right-sidebar-w: 230px;
    }
    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overscroll-behavior-x: none;
    }
    .theme-card { background-color: var(--bg-card); }
    .theme-border { border-color: var(--border-color); }
    .theme-sub { color: var(--text-sub); }
    .theme-accent-bg { background-color: var(--accent); }
    .theme-accent-text { color: var(--accent); }
    .theme-accent-border { border-color: var(--accent); }
    .post-text {
      font-size: var(--post-font-size);
      line-height: var(--post-line-height);
    }
    .post-card-pad {
      padding: var(--post-padding);
    }
    .post-collapsed {
      max-height: 185px;
      overflow: hidden;
      position: relative;
      mask-image: linear-gradient(to bottom, black 65%, transparent 100%);
      -webkit-mask-image: linear-gradient(to bottom, black 65%, transparent 100%);
    }

    /* Markdown & LaTeX 表示用スタイル */
    .md-content {
      font-size: var(--post-font-size);
      line-height: var(--post-line-height);
      color: var(--text-main);
      word-break: break-word;
    }
    .md-content h1 { font-size: 1.4em; font-weight: 800; margin: 0.6em 0 0.3em; border-bottom: 1px solid var(--border-color); padding-bottom: 0.2em; }
    .md-content h2 { font-size: 1.25em; font-weight: 800; margin: 0.6em 0 0.3em; }
    .md-content h3 { font-size: 1.1em; font-weight: 700; margin: 0.5em 0 0.2em; }
    .md-content p { margin: 0.4em 0; }
    .md-content strong { font-weight: 800; }
    .md-content ul { list-style-type: disc; padding-left: 1.5em; margin: 0.4em 0; }
    .md-content ol { list-style-type: decimal; padding-left: 1.5em; margin: 0.4em 0; }
    .md-content li { margin: 0.15em 0; }
    .md-content pre { background: #0d1117; color: #e6edf3; padding: 0.8em; border-radius: 8px; overflow-x: auto; margin: 0.5em 0; border: 1px solid var(--border-color); font-size: 0.88em; }
    .md-content code { font-family: monospace; background: rgba(128,128,128,0.2); padding: 0.1em 0.35em; border-radius: 4px; font-size: 0.9em; }
    .md-content pre code { background: transparent; padding: 0; }
    .md-content table { width: 100%; border-collapse: collapse; margin: 0.6em 0; font-size: 0.92em; display: block; overflow-x: auto; }
    .md-content th, .md-content td { border: 1px solid var(--border-color); padding: 0.45em 0.7em; text-align: left; }
    .md-content th { background: rgba(128,128,128,0.15); font-weight: 800; }
    .md-content blockquote { border-left: 3px solid var(--accent); padding-left: 0.8em; margin: 0.5em 0; color: var(--text-sub); }
    .md-content a { color: var(--accent); text-decoration: underline; }
    .katex-display { overflow-x: auto; overflow-y: hidden; padding: 0.3em 0; margin: 0.5em 0 !important; }

    @keyframes highlightPulse {
      0% { background-color: rgba(29, 155, 240, 0.28); }
      100% { background-color: transparent; }
    }
    .highlight-jump { animation: highlightPulse 2s ease-out; }
    .dragging-item { opacity: 0.45; border-color: var(--accent) !important; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    textarea { field-sizing: content; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2f3336; border-radius: 3px; }
    input[type="range"] { accent-color: var(--accent); }
  </style>
</head>
<body class="min-h-screen selection:bg-sky-500 selection:text-white">

  <!-- トースト通知 -->
  <div id="toast" class="fixed bottom-24 md:bottom-10 left-1/2 -translate-x-1/2 z-50 px-5 py-2.5 rounded-full theme-accent-bg text-white text-xs font-bold shadow-2xl transition-opacity duration-200 opacity-0 pointer-events-none">
    コピーしました
  </div>

  <!-- 複数選択モード時の下部一括コピーバー -->
  <div id="bulk-action-bar" class="hidden fixed bottom-16 md:bottom-6 left-1/2 -translate-x-1/2 z-40 theme-card border theme-border rounded-full px-4 py-2 shadow-2xl flex items-center gap-3 backdrop-blur-md">
    <span id="bulk-count-label" class="text-xs font-bold theme-accent-text whitespace-nowrap">0件選択中</span>
    <button onclick="selectAllVisiblePosts()" class="text-xs px-2.5 py-1 rounded-full bg-white/5 hover:bg-white/10 transition whitespace-nowrap">全選択</button>
    <button onclick="copySelectedPosts()" class="text-xs px-4 py-1.5 rounded-full theme-accent-bg text-white font-bold hover:opacity-90 transition flex items-center gap-1.5 whitespace-nowrap shadow">
      <i data-lucide="copy" class="w-3.5 h-3.5"></i>
      <span>まとめてコピー</span>
    </button>
    <button onclick="toggleSelectMode(false)" class="p-1 rounded-full hover:bg-white/10 theme-sub hover:text-white" title="選択モードを終了">
      <i data-lucide="x" class="w-4 h-4"></i>
    </button>
  </div>

  <!-- 未ログイン時のロック画面 -->
  <div id="login-screen" class="fixed inset-0 z-50 bg-black flex flex-col items-center justify-center p-6">
    <div class="w-full max-w-sm bg-[#16181c] border border-[#2f3336] rounded-2xl p-8 text-center shadow-2xl">
      <div class="w-16 h-16 rounded-2xl bg-white/5 border border-white/10 flex items-center justify-center mx-auto mb-4 text-white font-black text-4xl">
        𝕏
      </div>
      <h1 class="text-xl font-bold text-white mb-2">X-Note Personal</h1>
      <p class="text-xs text-gray-400 mb-6">自分専用の長文・スレッド・数式/化学式・メディア同期ノート</p>
      <button id="login-btn" class="w-full py-3 px-4 bg-white text-black font-bold rounded-full hover:bg-gray-200 transition flex items-center justify-center gap-2">
        <i data-lucide="log-in" class="w-4 h-4"></i>
        Googleでログイン
      </button>
      <p id="auth-error" class="text-xs text-red-400 mt-4 hidden"></p>
    </div>
  </div>
