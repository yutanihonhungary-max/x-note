            ${quotedCardHtml}

            <!-- アクションバー -->
            <div class="flex items-center justify-between max-w-md mt-2 -ml-2 text-xs theme-sub select-none">
              <button onclick="event.stopPropagation(); openPostModal('${targetThreadId}')" class="group flex items-center gap-1 hover:text-sky-400 transition" title="スレッドに返信">
                <div class="p-2 rounded-full group-hover:bg-sky-500/10 transition">
                  <svg class="w-[18px] h-[18px]" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 20.25c4.97 0 9-3.694 9-8.25s-4.03-8.25-9-8.25S3 7.444 3 12c0 2.104.859 4.023 2.273 5.48.432.447.74 1.04.586 1.641a4.483 4.483 0 01-.923 1.785A5.969 5.969 0 006 21c1.282 0 2.47-.402 3.445-1.087.81.22 1.668.337 2.555.337z"/>
                  </svg>
                </div>
                ${!isChild && replyCount > 0 ? `<span class="text-xs">${replyCount}</span>` : ''}
              </button>

              <button onclick="event.stopPropagation(); openQuoteModal('${post.id}')" class="group flex items-center gap-1 ${quoteCount > 0 ? 'text-emerald-400' : 'hover:text-emerald-400'} transition" title="このポストを引用リツイート">
                <div class="p-2 rounded-full group-hover:bg-emerald-500/10 transition">
                  <svg class="w-[18px] h-[18px]" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 12c0-1.232-.046-2.453-.138-3.662a4.006 4.006 0 00-3.7-3.7 48.678 48.678 0 00-7.324 0 4.006 4.006 0 00-3.7 3.7c-.017.22-.032.441-.046.662M19.5 12l3-3m-3 3l-3-3m-12 3c0 1.232.046 2.453.138 3.662a4.006 4.006 0 003.7 3.7 48.656 48.656 0 007.324 0 4.006 4.006 0 003.7-3.7c.017-.22.032-.441.046-.662M4.5 12l3 3m-3-3l-3 3"/>
                  </svg>
                </div>
                ${quoteCount > 0 ? `<span class="text-xs">${quoteCount}</span>` : ''}
              </button>

              <button onclick="event.stopPropagation(); toggleBookmark('${post.id}', ${!!post.bookmarked})" class="group flex items-center gap-1 ${post.bookmarked ? 'text-sky-400' : 'hover:text-sky-400'} transition" title="ブックマーク">
                <div class="p-2 rounded-full group-hover:bg-sky-500/10 transition">
                  <svg class="w-[18px] h-[18px]" fill="${post.bookmarked ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M17.593 3.322c1.1.128 1.907 1.077 1.907 2.185V21L12 17.25 4.5 21V5.507c0-1.108.806-2.057 1.907-2.185a48.507 48.507 0 0111.186 0z"/>
                  </svg>
                </div>
              </button>

              <button onclick="copyPostText('${post.id}', event)" class="group flex items-center gap-1 hover:text-sky-400 transition" title="このポストをコピー">
                <div class="p-2 rounded-full group-hover:bg-sky-500/10 transition">
                  <svg class="w-[17px] h-[17px]" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 17.25v3.375c0 .621-.504 1.125-1.125 1.125h-9.75a1.125 1.125 0 01-1.125-1.125V7.875c0-.621.504-1.125 1.125-1.125H6.75a9.06 9.06 0 011.5.124m7.5 10.376h3.375c.621 0 1.125-.504 1.125-1.125V11.25c0-4.46-3.243-8.161-7.5-8.876a9.06 9.06 0 00-1.5-.124H9.375c-.621 0-1.125.504-1.125 1.125v3.5m7.5 10.375H9.375a1.125 1.125 0 01-1.125-1.125v-9.25m12 6.625v-1.875a3.375 3.375 0 00-3.375-3.375h-1.5a1.125 1.125 0 01-1.125-1.125v-1.5a3.375 3.375 0 00-3.375-3.375H9.75"/>
                  </svg>
                </div>
              </button>

              ${!isChild ? `
                <button onclick="event.stopPropagation(); togglePin('${post.id}', ${!!post.pinned})" class="group flex items-center gap-1 ${post.pinned ? 'text-sky-400' : 'hover:text-sky-400'} transition" title="プロフィールに固定">
                  <div class="p-2 rounded-full group-hover:bg-sky-500/10 transition">
                    <svg class="w-[18px] h-[18px]" fill="${post.pinned ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M16 9V4h1c.55 0 1-.45 1-1s-.45-1-1-1H7c-.55 0-1 .45-1 1s.45 1 1 1h1v5c0 1.66-1.34 3-3 3v2h5.97v7l1 1 1-1v-7H19v-2c-1.66 0-3-1.34-3-3z"/>
                    </svg>
                  </div>
                </button>
              ` : ''}

              <button onclick="event.stopPropagation(); startEdit('${post.id}')" class="group flex items-center gap-1 hover:text-sky-400 transition" title="編集">
                <div class="p-2 rounded-full group-hover:bg-sky-500/10 transition">
                  <svg class="w-[17px] h-[17px]" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L6.832 19.82a4.5 4.5 0 01-1.897 1.13l-2.685.8.8-2.685a4.5 4.5 0 011.13-1.897L16.863 4.487zm0 0L19.5 7.125"/>
                  </svg>
                </div>
              </button>

              <button onclick="event.stopPropagation(); deletePost('${post.id}')" class="group flex items-center gap-1 hover:text-red-400 transition" title="削除">
                <div class="p-2 rounded-full group-hover:bg-red-500/10 transition">
                  <svg class="w-[17px] h-[17px]" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0"/>
                  </svg>
                </div>
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function renderFeed() {
      const list = document.getElementById('feed-list');
      if (!list) return;
      const query = document.getElementById('search-input').value.trim().toLowerCase();
      list.innerHTML = '';

      const childrenMap = {};
      const quoteCountMap = {};
      postsData.forEach(p => {
        if (p.parentId) {
          if (!childrenMap[p.parentId]) childrenMap[p.parentId] = [];
          childrenMap[p.parentId].push(p);
        }
        if (p.quotedPostId) {
          quoteCountMap[p.quotedPostId] = (quoteCountMap[p.quotedPostId] || 0) + 1;
        }
      });
      Object.values(childrenMap).forEach(arr => arr.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0)));

      const rootPosts = postsData.filter(p => !p.parentId);
      rootPosts.sort((a, b) => {
        if (currentFilter === 'all' && !!b.pinned !== !!a.pinned) return b.pinned ? 1 : -1;
        return (b.createdAt || 0) - (a.createdAt || 0);
      });

      const filteredRoots = rootPosts.filter(post => {
        const threadPosts = [post, ...(childrenMap[post.id] || [])];
        if (currentCategory !== 'すべて' && post.category !== currentCategory) return false;
        if (currentFilter === 'bookmark' && !threadPosts.some(tp => tp.bookmarked)) return false;
        if (currentFilter === 'media' && !threadPosts.some(tp => (tp.blocks || []).some(b => b.type !== 'text'))) return false;
        if (query) {
          const allText = threadPosts.map(tp => (tp.title || '') + ' ' + (tp.blocks || []).map(b => b.content || htmlToPlainText(b.html || '') || b.caption || '').join(' ')).join(' ').toLowerCase();
          return allText.includes(query);
        }
        return true;
      });

      if (filteredRoots.length === 0) {
        const emptyMsg = currentFilter === 'bookmark'
          ? 'まだブックマークされたポストがありません。各ポストのリボンアイコンから保存できます。'
          : currentFilter === 'media'
          ? '写真や動画付きのポストがありません。'
          : '表示できるポストがありません（右下の「＋」ボタンから投稿できます）';
        list.innerHTML = `<div class="p-12 text-center text-sm theme-sub">${emptyMsg}</div>`;
        return;
      }

      filteredRoots.forEach(root => {
        const replies = childrenMap[root.id] || [];
        const article = document.createElement('article');
        article.id = `post-article-${root.id}`;
        article.className = "post-card-pad hover:bg-white/[0.02] transition";

        let html = buildPostItemHtml(root, false, replies.length > 0, replies.length, quoteCountMap[root.id] || 0);
        replies.forEach((rep, idx) => {
          html += buildPostItemHtml(rep, true, idx < replies.length - 1, 0, quoteCountMap[rep.id] || 0);
        });

        article.innerHTML = html;
        list.appendChild(article);
      });

      hydrateTweetCards();
    }

    window.filterByTag = function(tag) {
      document.getElementById('search-input').value = tag;
      renderFeed();
    };

    window.togglePin = (id, cur) => update(ref(db, `users/${currentUser.uid}/posts/${id}`), { pinned: !cur });
    window.toggleBookmark = (id, cur) => update(ref(db, `users/${currentUser.uid}/posts/${id}`), { bookmarked: !cur });
    window.deletePost = (id) => { if (confirm('このポストを削除しますか？')) remove(ref(db, `users/${currentUser.uid}/posts/${id}`)); };

    window.startEdit = function(id) {
      const post = postsData.find(p => p.id === id);
      if (!post) return;
      editingPostId = id;
      replyParentId = post.parentId || null;
      quotedPostId = post.quotedPostId || null;
      quotedExternalUrl = post.quotedExternalUrl || null;
      document.getElementById('post-title').value = post.title || '';
      if (post.category) document.getElementById('post-category').value = post.category;
      editorBlocks = JSON.parse(JSON.stringify(post.blocks || [{ id: crypto.randomUUID(), type: 'text', content: '', html: '' }]));
      document.getElementById('modal-mode-label').textContent = 'ポストを編集';
      document.getElementById('submit-btn').textContent = '更新する';
      document.getElementById('reply-parent-info').classList.add('hidden');
      document.getElementById('post-modal').classList.remove('hidden');
      renderEditor();
      renderQuotePreviewInModal();
    };

    window.openLightbox = function(url) {
      document.getElementById('lightbox-img').src = url;
      document.getElementById('lightbox').classList.remove('hidden');
    };

    document.getElementById('search-input').addEventListener('input', renderFeed);

    updateNavigationUI();
    renderCategories();
    renderEditor();
    safeCreateIcons();
  </script>
</body>
</html>
