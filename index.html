<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>𝕏 - Personal Note</title>
  
  <!-- X風のファビコン -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23000000'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='central' text-anchor='middle' fill='%23ffffff' font-family='sans-serif' font-weight='900' font-size='68'%3E%F0%9D%95%8F%3C/text%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23000000'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='central' text-anchor='middle' fill='%23ffffff' font-family='sans-serif' font-weight='900' font-size='68'%3E%F0%9D%95%8F%3C/text%3E%3C/svg%3E">
  
  <!-- PWA用設定 -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="X-Note">
  
  <!-- Tailwind CSS, Lucide Icons, Marked (Markdown変換), DOMPurify (安全なHTML整形) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.9/dist/purify.min.js"></script>
  
  <style>
    :root {
      --bg-main: #000000;
      --bg-card: #16181c;
      --bg-hover: rgba(255, 255, 255, 0.03);
      --text-main: #e7e9ea;
      --text-sub: #71767b;
      --border-color: #2f3336;
      --accent: #1d9bf0;
      --post-font-size: 15px;
      --post-line-height: 1.65;
      --post-padding: 16px;
      --right-sidebar-w: 230px;
    }
    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overscroll-behavior-x: none;
    }
    .theme-card { background-color: var(--bg-card); }
    .theme-border { border-color: var(--border-color); }
    .theme-sub { color: var(--text-sub); }
    .theme-accent-bg { background-color: var(--accent); }
    .theme-accent-text { color: var(--accent); }
    .theme-accent-border { border-color: var(--accent); }
    .post-text {
      font-size: var(--post-font-size);
      line-height: var(--post-line-height);
    }
    .post-card-pad {
      padding: var(--post-padding);
    }
    .post-collapsed {
      max-height: 185px;
      overflow: hidden;
      position: relative;
      mask-image: linear-gradient(to bottom, black 60%, transparent 100%);
      -webkit-mask-image: linear-gradient(to bottom, black 60%, transparent 100%);
    }

    /* ★ ChatGPT / Gemini のコピペ（見出し・太字・表・リスト・コード）を完全再現するリッチスタイル */
    .rich-content {
      font-size: var(--post-font-size);
      line-height: var(--post-line-height);
      color: var(--text-main);
      word-break: break-word;
    }
    /* 万が一混入したiframeや壊れたオブジェクトは強制非表示 */
    .rich-content iframe, .rich-content object, .rich-content embed, .rich-content frame {
      display: none !important;
    }
    .rich-content h1 {
      font-size: 1.45em;
      font-weight: 800;
      margin: 0.75em 0 0.4em;
      line-height: 1.3;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 0.25em;
    }
    .rich-content h2 {
      font-size: 1.25em;
      font-weight: 800;
      margin: 0.7em 0 0.35em;
      line-height: 1.35;
    }
    .rich-content h3 {
      font-size: 1.1em;
      font-weight: 700;
      margin: 0.6em 0 0.25em;
      line-height: 1.4;
    }
    .rich-content h4, .rich-content h5, .rich-content h6 {
      font-size: 1em;
      font-weight: 700;
      margin: 0.5em 0 0.2em;
    }
    .rich-content p {
      margin: 0.45em 0;
    }
    .rich-content strong, .rich-content b {
      font-weight: 800;
      color: var(--text-main);
    }
    .rich-content em, .rich-content i {
      font-style: italic;
    }
    .rich-content ul {
      list-style-type: disc;
      padding-left: 1.5em;
      margin: 0.45em 0;
    }
    .rich-content ol {
      list-style-type: decimal;
      padding-left: 1.5em;
      margin: 0.45em 0;
    }
    .rich-content li {
      margin: 0.2em 0;
    }
    .rich-content li > p {
      margin: 0.15em 0;
    }
    .rich-content hr {
      border: 0;
      border-top: 1px solid var(--border-color);
      margin: 0.9em 0;
    }
    .rich-content blockquote {
      border-left: 3px solid var(--accent);
      padding: 0.25em 0.85em;
      margin: 0.6em 0;
      background: rgba(128, 128, 128, 0.07);
      border-radius: 0 8px 8px 0;
    }
    .rich-content code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.88em;
      background: rgba(128, 128, 128, 0.18);
      padding: 0.15em 0.4em;
      border-radius: 5px;
    }
    .rich-content pre {
      background: #0d1117;
      color: #e6edf3;
      padding: 0.85em 1em;
      border-radius: 10px;
      overflow-x: auto;
      margin: 0.65em 0;
      border: 1px solid var(--border-color);
      font-size: 0.88em;
      line-height: 1.5;
    }
    .rich-content pre code {
      background: transparent;
      padding: 0;
      color: inherit;
      font-size: inherit;
    }
    /* 表（テーブル）の完全再現スタイル */
    .rich-content table {
      width: 100%;
      border-collapse: collapse;
      margin: 0.75em 0;
      font-size: 0.92em;
      display: block;
      overflow-x: auto;
    }
    .rich-content th, .rich-content td {
      border: 1px solid var(--border-color);
      padding: 0.5em 0.75em;
      text-align: left;
      vertical-align: top;
    }
    .rich-content th {
      background-color: rgba(128, 128, 128, 0.14);
      font-weight: 800;
      white-space: nowrap;
    }
    .rich-content tr:nth-child(even) td {
      background-color: rgba(128, 128, 128, 0.04);
    }
    .rich-content a {
      color: var(--accent);
      text-decoration: underline;
    }

    /* リッチエディタ入力欄のプレースホルダー表示 */
    .rich-editor-box:empty:before {
      content: attr(data-placeholder);
      color: #71767b;
      pointer-events: none;
      display: block;
    }

    @keyframes highlightPulse {
      0% { background-color: rgba(29, 155, 240, 0.28); }
      100% { background-color: transparent; }
    }
    .highlight-jump {
      animation: highlightPulse 2s ease-out;
    }
    .dragging-item {
      opacity: 0.45;
      border-color: var(--accent) !important;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    textarea { field-sizing: content; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2f3336; border-radius: 3px; }
    input[type="range"] {
      accent-color: var(--accent);
    }
  </style>
</head>
<body class="min-h-screen selection:bg-sky-500 selection:text-white">

  <!-- トースト通知 -->
  <div id="toast" class="fixed bottom-24 md:bottom-10 left-1/2 -translate-x-1/2 z-50 px-5 py-2.5 rounded-full theme-accent-bg text-white text-xs font-bold shadow-2xl transition-opacity duration-200 opacity-0 pointer-events-none">
    コピーしました
  </div>

  <!-- 複数選択モード時の下部一括コピーバー -->
  <div id="bulk-action-bar" class="hidden fixed bottom-16 md:bottom-6 left-1/2 -translate-x-1/2 z-40 theme-card border theme-border rounded-full px-4 py-2 shadow-2xl flex items-center gap-3 backdrop-blur-md">
    <span id="bulk-count-label" class="text-xs font-bold theme-accent-text whitespace-nowrap">0件選択中</span>
    <button onclick="selectAllVisiblePosts()" class="text-xs px-2.5 py-1 rounded-full bg-white/5 hover:bg-white/10 transition whitespace-nowrap">全選択</button>
    <button onclick="copySelectedPosts()" class="text-xs px-4 py-1.5 rounded-full theme-accent-bg text-white font-bold hover:opacity-90 transition flex items-center gap-1.5 whitespace-nowrap shadow">
      <i data-lucide="copy" class="w-3.5 h-3.5"></i>
      <span>まとめてコピー</span>
    </button>
    <button onclick="toggleSelectMode(false)" class="p-1 rounded-full hover:bg-white/10 theme-sub hover:text-white" title="選択モードを終了">
      <i data-lucide="x" class="w-4 h-4"></i>
    </button>
  </div>

  <!-- 未ログイン時のロック画面 -->
  <div id="login-screen" class="fixed inset-0 z-50 bg-black flex flex-col items-center justify-center p-6">
    <div class="w-full max-w-sm bg-[#16181c] border border-[#2f3336] rounded-2xl p-8 text-center shadow-2xl">
      <div class="w-16 h-16 rounded-2xl bg-white/5 border border-white/10 flex items-center justify-center mx-auto mb-4 text-white font-black text-4xl">
        𝕏
      </div>
      <h1 class="text-xl font-bold text-white mb-1">X-Note Personal</h1>
      <p id="login-status-text" class="text-xs text-gray-400 mb-6">認証状態を確認中...</p>
      <button id="login-btn" class="w-full py-3 px-4 bg-white text-black font-bold rounded-full hover:bg-gray-200 transition flex items-center justify-center gap-2">
        <span>Googleでログイン（ポップアップ）</span>
      </button>
      <button id="login-redirect-btn" class="w-full mt-2.5 py-2.5 px-4 bg-white/10 text-gray-200 font-bold text-xs rounded-full hover:bg-white/15 transition">
        画面が切り替わらない場合はこちら（リダイレクト認証）
      </button>
      <p id="auth-error" class="text-xs text-red-400 mt-4 hidden break-all"></p>
    </div>
  </div>

  <!-- メイン画面 -->
  <div id="app-screen" class="hidden max-w-7xl mx-auto min-h-screen flex">
    
    <!-- 左サイドバー（PC用） -->
    <aside class="hidden md:flex flex-col w-60 border-r theme-border p-4 sticky top-0 h-screen justify-between shrink-0">
      <div class="space-y-1">
        <div class="px-3 py-2 text-3xl font-black tracking-tighter flex items-center justify-between">
          <span>𝕏</span>
          <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">v3.5</span>
        </div>
        <button id="nav-btn-all" onclick="setFilter('all')" class="w-full flex items-center gap-4 px-4 py-3 rounded-full hover:bg-white/5 transition">
          <i data-lucide="home" class="w-5 h-5"></i> <span>ホーム</span>
        </button>
        <button id="nav-btn-bookmark" onclick="setFilter('bookmark')" class="w-full flex items-center gap-4 px-4 py-3 rounded-full hover:bg-white/5 transition">
          <i data-lucide="bookmark" class="w-5 h-5"></i> <span>ブックマーク</span>
        </button>
        <button id="nav-btn-media" onclick="setFilter('media')" class="w-full flex items-center gap-4 px-4 py-3 rounded-full hover:bg-white/5 transition">
          <i data-lucide="image" class="w-5 h-5"></i> <span>メディア</span>
        </button>
        <button onclick="openCategoryModal()" class="lg:hidden w-full flex items-center gap-4 px-4 py-3 rounded-full hover:bg-white/5 theme-sub hover:text-white transition">
          <i data-lucide="folder-kanban" class="w-5 h-5"></i> <span>タブ管理</span>
        </button>
        <button onclick="openProfileModal()" class="w-full flex items-center gap-4 px-4 py-3 rounded-full hover:bg-white/5 theme-sub hover:text-white transition">
          <i data-lucide="user" class="w-5 h-5"></i> <span>プロフィール設定</span>
        </button>
        <button onclick="openDisplayModal()" class="w-full flex items-center gap-4 px-4 py-3 rounded-full hover:bg-white/5 theme-sub hover:text-white transition">
          <i data-lucide="sliders" class="w-5 h-5"></i> <span>表示・文字・配色</span>
        </button>

        <div class="pt-4">
          <button onclick="openPostModal()" class="w-full py-3.5 rounded-full theme-accent-bg text-white font-bold text-base shadow-lg hover:opacity-90 transition flex items-center justify-center gap-2">
            <i data-lucide="feather" class="w-5 h-5"></i>
            <span>ポストする</span>
          </button>
        </div>
      </div>

      <div class="border-t theme-border pt-4 flex items-center justify-between px-2">
        <div class="flex items-center gap-2.5 min-w-0">
          <img id="sidebar-avatar" src="" class="w-9 h-9 rounded-full object-cover border theme-border shrink-0">
          <div class="min-w-0">
            <div id="sidebar-name" class="text-xs font-bold truncate">My Note</div>
            <div id="user-email" class="text-[11px] theme-sub truncate"></div>
          </div>
        </div>
        <button id="logout-btn" class="p-2 text-red-400 hover:bg-red-500/10 rounded-full transition" title="ログアウト">
          <i data-lucide="log-out" class="w-4 h-4"></i>
        </button>
      </div>
    </aside>

    <!-- 中央タイムライン -->
    <main id="main-swipe-area" class="flex-1 min-w-0 border-r theme-border pb-24 md:pb-12">
      
      <!-- 上部固定ヘッダー＆タブバー -->
      <header class="sticky top-0 z-30 backdrop-blur-md bg-black/80 border-b theme-border">
        <div class="px-4 py-2.5 flex items-center justify-between gap-2">
          <div class="flex items-center gap-2">
            <button id="back-home-btn" onclick="setFilter('all')" class="hidden p-1.5 -ml-1 rounded-full hover:bg-white/10 transition" title="ホームに戻る">
              <i data-lucide="arrow-left" class="w-4 h-4"></i>
            </button>
            <span class="md:hidden font-black text-2xl">𝕏</span>
            <div>
              <div class="flex items-center gap-2">
                <h2 id="header-title" class="font-bold text-base leading-tight whitespace-nowrap">ホーム</h2>
                <span id="header-mode-badge" class="hidden text-[10px] px-2 py-0.5 rounded-full font-bold bg-sky-500/20 text-sky-400 border border-sky-500/30"></span>
              </div>
              <p id="header-subtitle" class="text-[11px] theme-sub hidden"></p>
            </div>
          </div>

          <div class="flex items-center gap-1.5 flex-1 justify-end max-w-md">
            <div class="relative flex-1">
              <i data-lucide="search" class="w-4 h-4 theme-sub absolute left-3 top-1/2 -translate-y-1/2"></i>
              <input id="search-input" type="text" placeholder="検索や #タグ..." class="w-full theme-card border theme-border rounded-full pl-9 pr-3 py-1.5 text-xs outline-none">
            </div>

            <button onclick="refreshAllTweetsInApp()" class="px-2.5 py-1.5 rounded-full border theme-border text-xs font-bold theme-sub hover:text-white hover:bg-white/5 transition flex items-center gap-1 shrink-0" title="過去のXツイートリンクの全文・動画データを一括で再取得して修復します">
              <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
              <span class="hidden sm:inline">X再取得</span>
            </button>

            <button id="select-mode-btn" onclick="toggleSelectMode()" class="px-2.5 py-1.5 rounded-full border theme-border text-xs font-bold theme-sub hover:text-white hover:bg-white/5 transition flex items-center gap-1 shrink-0" title="複数のポストを選択してまとめてコピー">
              <i data-lucide="check-square" class="w-3.5 h-3.5"></i>
              <span class="hidden sm:inline">複数選択</span>
            </button>
          </div>
        </div>

        <!-- タブバー -->
        <div id="category-tabs" class="flex items-center overflow-x-auto border-t theme-border text-xs font-bold no-scrollbar"></div>
      </header>

      <!-- モード切替バナー -->
      <div id="filter-banner" class="hidden px-4 py-3 border-b theme-border flex items-center justify-between bg-sky-500/10">
        <div class="flex items-center gap-2.5">
          <div id="filter-banner-icon" class="w-8 h-8 rounded-full bg-sky-500/20 text-sky-400 flex items-center justify-center"></div>
          <div>
            <div id="filter-banner-title" class="text-xs font-bold text-white">ブックマーク表示中</div>
            <div id="filter-banner-desc" class="text-[11px] theme-sub">保存したポストのみを表示しています</div>
          </div>
        </div>
        <button onclick="setFilter('all')" class="px-3 py-1 rounded-full text-xs font-bold bg-white/10 hover:bg-white/20 text-white transition">
          ホームに戻る
        </button>
      </div>

      <!-- X風プロフィールヘッダー -->
      <section id="profile-section" class="border-b theme-border">
        <div class="h-36 sm:h-44 w-full bg-gradient-to-r from-slate-900 via-sky-950 to-slate-900 relative overflow-hidden">
          <img id="profile-banner" src="" class="w-full h-full object-cover hidden">
        </div>
        <div class="px-4 pb-4 relative">
          <div class="flex justify-between items-end -mt-12 sm:-mt-14 mb-3">
            <img id="profile-avatar" src="" class="w-24 h-24 sm:w-28 sm:h-28 rounded-full border-4 border-black object-cover bg-zinc-900">
            <div class="flex gap-2">
              <button onclick="openCategoryModal()" class="lg:hidden px-3.5 py-1.5 rounded-full border theme-border text-xs font-bold hover:bg-white/5 transition">
                タブ管理
              </button>
              <button onclick="openProfileModal()" class="px-4 py-1.5 rounded-full border theme-border text-xs font-bold hover:bg-white/5 transition">
                プロフィールを編集
              </button>
            </div>
          </div>
          <h1 id="profile-name" class="font-extrabold text-lg leading-tight">Personal Note</h1>
          <div id="profile-handle" class="text-xs theme-sub mb-2">@my_private_x</div>
          <p id="profile-bio" class="text-xs whitespace-pre-wrap leading-relaxed"></p>
        </div>
      </section>

      <!-- 投稿一覧フィード -->
      <div id="feed-list" class="divide-y theme-border min-h-[50vh]"></div>
    </main>

    <!-- 境界線ドラッグリサイザー -->
    <div id="sidebar-resizer" class="hidden lg:flex w-1.5 cursor-col-resize items-center justify-center hover:bg-sky-500/40 active:bg-sky-500 transition select-none shrink-0" title="左右にドラッグしてタブ管理の幅を調整">
      <div class="w-0.5 h-10 bg-zinc-700 rounded-full"></div>
    </div>

    <!-- 右サイドバー（タブ管理） -->
    <aside id="right-sidebar" style="width: var(--right-sidebar-w);" class="hidden lg:block p-2.5 sticky top-0 h-screen overflow-y-auto shrink-0">
      <div class="theme-card rounded-2xl p-3 border theme-border space-y-2.5">
        <div class="flex items-center justify-between gap-1">
          <h3 class="font-bold text-xs flex items-center gap-1.5 truncate">
            <i data-lucide="folder-kanban" class="w-3.5 h-3.5 theme-accent-text shrink-0"></i>
            <span class="truncate">タブ管理</span>
          </h3>
          <span id="sidebar-width-label" class="text-[10px] theme-sub shrink-0">230px</span>
        </div>

        <div class="flex items-center gap-2 bg-black/30 px-2.5 py-1.5 rounded-xl border theme-border">
          <span class="text-[10px] theme-sub whitespace-nowrap">幅</span>
          <input id="sidebar-width-slider" type="range" min="160" max="420" step="5" value="230"
            oninput="changeRightSidebarWidth(this.value, false)"
            onchange="changeRightSidebarWidth(this.value, true)"
            class="w-full h-1 rounded-lg cursor-pointer">
        </div>

        <div class="flex gap-1">
          <input id="sidebar-new-category-input" type="text" placeholder="新規タブ名..."
            onkeydown="if(event.key==='Enter') addCategory('sidebar-new-category-input')"
            class="min-w-0 flex-1 bg-black/40 border theme-border rounded-xl px-2.5 py-1.5 text-xs outline-none focus:border-sky-500">
          <button onclick="addCategory('sidebar-new-category-input')" class="px-2.5 py-1.5 rounded-xl theme-accent-bg text-white font-bold text-xs shrink-0 hover:opacity-90 transition">
            ＋
          </button>
        </div>

        <div id="sidebar-category-manage-list" class="space-y-1 text-xs"></div>
      </div>
    </aside>
  </div>

  <!-- 右下フローティング「＋」投稿ボタン -->
  <button onclick="openPostModal()" class="fixed right-5 bottom-20 md:bottom-8 z-40 w-14 h-14 rounded-full theme-accent-bg text-white shadow-2xl flex items-center justify-center hover:scale-105 active:scale-95 transition" title="新規ポスト">
    <i data-lucide="plus" class="w-7 h-7"></i>
  </button>

  <!-- スマホ用下部ナビゲーション -->
  <nav class="md:hidden fixed bottom-0 inset-x-0 z-30 bg-black/95 backdrop-blur border-t theme-border flex justify-around py-2.5">
    <button id="m-nav-all" onclick="setFilter('all')" class="p-2 rounded-full transition"><i data-lucide="home" class="w-5 h-5"></i></button>
    <button id="m-nav-bookmark" onclick="setFilter('bookmark')" class="p-2 rounded-full transition"><i data-lucide="bookmark" class="w-5 h-5"></i></button>
    <button id="m-nav-media" onclick="setFilter('media')" class="p-2 rounded-full transition"><i data-lucide="image" class="w-5 h-5"></i></button>

  <!-- Firebase Realtime Database & Auth -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getDatabase, ref, set, push, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    function safeCreateIcons() {
      try {
        if (window.lucide && typeof window.lucide.createIcons === 'function') {
          window.lucide.createIcons();
        }
      } catch (e) {}
    }

    if (window.marked && typeof window.marked.setOptions === 'function') {
      window.marked.setOptions({ gfm: true, breaks: true });
    }

    // =========================================================================
    // ★ あなたの firebaseConfig（組込済み）
    // =========================================================================
    const firebaseConfig = {
      apiKey: "AIzaSyDHY8YRAmdJlGdB24inmnX5wmL4Ikt66bA",
      authDomain: "my-x-note.firebaseapp.com",
      databaseURL: "https://my-x-note-default-rtdb.firebaseio.com",
      projectId: "my-x-note",
      storageBucket: "my-x-note.firebasestorage.app",
      messagingSenderId: "778175713960",
      appId: "1:778175713960:web:3d5362414e42877ea1e89d"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);
    const provider = new GoogleAuthProvider();

    const DEFAULT_AVATAR = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%231d9bf0'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='central' text-anchor='middle' fill='%23ffffff' font-family='sans-serif' font-weight='900' font-size='52'%3E%F0%9D%95%8F%3C/text%3E%3C/svg%3E";
    const CURRENT_SCHEMA_VERSION = 3;

    let currentUser = null;
    let postsData = [];
    let categories = ['すべて', '日記', 'メモ', 'アイデア'];
    let currentCategory = 'すべて';
    let currentFilter = 'all';
    let editingPostId = null;
    let replyParentId = null;

    let quotedPostId = null;
    let quotedExternalUrl = null;

    let isSelectMode = false;
    const selectedPostIds = new Set();

    const expandedPostIds = new Set();
    const expandedTweetCardIds = new Set();
    const tweetCache = {};

    let profileData = {
      name: 'Personal Note',
      handle: '@my_note',
      bio: '自分専用の長文・メディア・スレッド同期ノート',
      avatar: DEFAULT_AVATAR,
      banner: ''
    };

    let themeSettings = {
      fontSize: '15px',
      lineHeight: '1.65',
      padding: '16px',
      bgMode: 'black',
      accent: '#1d9bf0',
      rightSidebarWidth: 230
    };

    let editorBlocks = [{ id: crypto.randomUUID(), type: 'text', content: '', html: '' }];
    let activeBlockIndex = 0;

    function showToast(msg) {
      const t = document.getElementById('toast');
      if (!t) return;
      t.textContent = msg;
      t.classList.remove('opacity-0');
      setTimeout(() => t.classList.add('opacity-0'), 2200);
    }

    // =========================================================================
    // ★ ChatGPT / Gemini コピペ時の 404 iframe 混入を完全排除するサニタイザー
    // =========================================================================
    const ALLOWED_RICH_TAGS = [
      'h1', 'h2', 'h3', 'h4', 'h5', 'h6',
      'p', 'br', 'hr',
      'strong', 'b', 'em', 'i', 'u', 's', 'del', 'mark', 'sub', 'sup',
      'ul', 'ol', 'li',
      'table', 'thead', 'tbody', 'tr', 'th', 'td',
      'blockquote', 'pre', 'code',
      'a', 'span', 'div'
    ];

    function cleanRichHtml(rawHtml) {
      if (!rawHtml) return '';

      // まずDOM上で iframe / object / script / style / button / svg 等のノイズ要素を物理的に全削除
      const temp = document.createElement('div');
      temp.innerHTML = rawHtml;
      temp.querySelectorAll('iframe, frame, frameset, object, embed, applet, script, style, link, meta, button, svg, canvas, form, input, textarea, select').forEach(el => el.remove());

      // 相対パスの壊れたリンク（404の原因）は無害なテキストに変換し、http(s)リンクのみ残す
      temp.querySelectorAll('a').forEach(a => {
        const href = (a.getAttribute('href') || '').trim();
        if (!/^https?:\/\//i.test(href)) {
          a.removeAttribute('href');
        } else {
          a.setAttribute('target', '_blank');
          a.setAttribute('rel', 'noopener noreferrer');
        }
      });

      let cleaned = temp.innerHTML;
      if (window.DOMPurify) {
        cleaned = window.DOMPurify.sanitize(cleaned, {
          ALLOWED_TAGS: ALLOWED_RICH_TAGS,
          ALLOWED_ATTR: ['href', 'target', 'rel', 'colspan', 'rowspan'],
          FORBID_TAGS: ['iframe', 'object', 'embed', 'frame', 'script', 'style', 'button', 'svg', 'form', 'input']
        });
      }
      return cleaned;
    }

    function hasMarkdownSyntax(text) {
      if (!text) return false;
      return /(^|\n)\s*#{1,6}\s+|\*\*[^*]+\*\*|(^|\n)\s*[-*+]\s+|(^|\n)\s*\d+\.\s+|```|\|.+\|\s*\n\s*\|[-:| ]+\|/m.test(text);
    }

    function renderFormattedBlockContent(block) {
      const rawHtml = (block.html || '').trim();
      const rawText = (block.content || '').trim();

      let outputHtml = '';

      if (rawHtml) {
        // 既に保存されたHTMLからもiframe等のノイズを完全に除去して描画
        outputHtml = cleanRichHtml(rawHtml);
      } else if (hasMarkdownSyntax(rawText) && window.marked) {
        outputHtml = cleanRichHtml(window.marked.parse(rawText));
      } else {
        const escaped = (block.content || '')
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()" class="theme-accent-text hover:underline break-all">$1</a>')
          .replace(/(^|\s)(#[^\s#<]+)/g, '$1<span onclick="event.stopPropagation(); filterByTag(\'$2\')" class="theme-accent-text hover:underline cursor-pointer">$2</span>');
        return `<div class="whitespace-pre-wrap post-text my-1">${escaped}</div>`;
      }

      const wrapper = document.createElement('div');
      wrapper.innerHTML = outputHtml;
      wrapper.querySelectorAll('a').forEach(a => {
        a.setAttribute('target', '_blank');
        a.setAttribute('rel', 'noopener noreferrer');
        a.setAttribute('onclick', 'event.stopPropagation()');
      });

      return `<div class="rich-content my-1">${wrapper.innerHTML}</div>`;
    }

    function htmlToPlainText(htmlStr) {
      if (!htmlStr) return '';
      const temp = document.createElement('div');
      temp.innerHTML = cleanRichHtml(htmlStr)
        .replace(/<\/(p|div|h[1-6]|li|tr|blockquote|pre)>/gi, '$&\n')
        .replace(/<br\s*\/?>/gi, '\n')
        .replace(/<\/(td|th)>/gi, '$&\t');
      return (temp.textContent || temp.innerText || '').replace(/\n{3,}/g, '\n\n').trim();
    }

    // =========================================================================
    // ログイン処理
    // =========================================================================
    getRedirectResult(auth).catch((err) => {
      const errEl = document.getElementById('auth-error');
      if (errEl && err) {
        errEl.textContent = "リダイレクト認証エラー: " + err.message;
        errEl.classList.remove('hidden');
      }
    });

    document.getElementById('login-btn').addEventListener('click', async () => {
      const errEl = document.getElementById('auth-error');
      const statusEl = document.getElementById('login-status-text');
      errEl.classList.add('hidden');
      statusEl.textContent = "Google認証ウィンドウを開いています...";
      try {
        await signInWithPopup(auth, provider);
      } catch (err) {
        if (err.code === 'auth/popup-blocked' || err.code === 'auth/operation-not-supported-in-this-environment') {
          statusEl.textContent = "リダイレクト認証へ切り替えています...";
          await signInWithRedirect(auth, provider);
        } else {
          statusEl.textContent = "ログインボタンを押してください";
          errEl.textContent = "ログインエラー (" + (err.code || '') + "): " + err.message;
          errEl.classList.remove('hidden');
        }
      }
    });

    document.getElementById('login-redirect-btn').addEventListener('click', async () => {
      const statusEl = document.getElementById('login-status-text');
      statusEl.textContent = "Googleログイン画面へ移動しています...";
      try {
        await signInWithRedirect(auth, provider);
      } catch (err) {
        const errEl = document.getElementById('auth-error');
        errEl.textContent = "エラー: " + err.message;
        errEl.classList.remove('hidden');
      }
    });

    document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));

    let dbSubscribedUid = null;

    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      const loginScreen = document.getElementById('login-screen');
      const appScreen = document.getElementById('app-screen');
      const statusEl = document.getElementById('login-status-text');

      if (!user) {
        dbSubscribedUid = null;
        if (statusEl) statusEl.textContent = "自分専用の長文・スレッド・引用・メディア同期ノート";
        loginScreen.classList.remove('hidden');
        appScreen.classList.add('hidden');
        return;
      }

      loginScreen.classList.add('hidden');
      appScreen.classList.remove('hidden');
      document.getElementById('user-email').textContent = user.email || '';

      if (dbSubscribedUid === user.uid) return;
      dbSubscribedUid = user.uid;

      onValue(ref(db, `users/${user.uid}/tweetSnapshots`), (snap) => {
        const val = snap.val() || {};
        Object.entries(val).forEach(([tid, tData]) => {
          if (tData && tData.schemaVersion === CURRENT_SCHEMA_VERSION) {
            tweetCache[tid] = tData;
          }
        });
        renderFeed();
      });

      onValue(ref(db, `users/${user.uid}/posts`), (snap) => {
        const val = snap.val() || {};
        postsData = Object.entries(val).map(([id, item]) => ({ id, ...item }));
        updateNavigationUI();
        renderFeed();
      });

      onValue(ref(db, `users/${user.uid}/profile`), (snap) => {
        if (snap.val()) profileData = { ...profileData, ...snap.val() };
        applyProfileUI();
      });

      onValue(ref(db, `users/${user.uid}/categories`), (snap) => {
        if (snap.val() && Array.isArray(snap.val())) categories = snap.val();
        renderCategories();
      });

      onValue(ref(db, `users/${user.uid}/settings`), (snap) => {
        if (snap.val()) themeSettings = { ...themeSettings, ...snap.val() };

    function formatSinglePostForCopy(post) {
      const parts = [];
      const dateStr = new Date(post.createdAt || Date.now()).toLocaleString('ja-JP', {
        year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit'
      });
      parts.push(`[${dateStr}]${post.category ? ` [${post.category}]` : ''}${post.title ? ` ${post.title}` : ''}`);
      (post.blocks || []).forEach(b => {
        if (b.type === 'text') {
          const txt = b.content || htmlToPlainText(b.html || '');
          if (txt) parts.push(txt);
        } else if (b.type === 'embed' && b.url) {
          parts.push(b.url);
        }
      });
      if (post.quotedExternalUrl) parts.push(`引用: ${post.quotedExternalUrl}`);
      return parts.join('\n');
    }

    window.copySelectedPosts = async function() {
      if (selectedPostIds.size === 0) {
        showToast('コピーするポストを選択してください');
        return;
      }
      const selectedList = postsData
        .filter(p => selectedPostIds.has(p.id))
        .sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));

      const combinedText = selectedList.map(formatSinglePostForCopy).join('\n\n────────────────\n\n');
      try {
        await navigator.clipboard.writeText(combinedText);
      } catch (e) {
        const ta = document.createElement('textarea');
        ta.value = combinedText;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      }
      showToast(`${selectedList.length}件のポストをまとめてコピーしました`);
      toggleSelectMode(false);
    };

    window.handleCatDragStart = function(e, idx) {
      dragSrcCatIdx = idx;
      e.currentTarget.classList.add('dragging-item');
      e.dataTransfer.effectAllowed = 'move';
    };

    window.handleCatDragOver = function(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
    };

    window.handleCatDrop = function(e, targetIdx) {
      e.preventDefault();
      if (dragSrcCatIdx === null || dragSrcCatIdx === targetIdx) return;
      const userCats = categories.filter(c => c !== 'すべて');
      const [moved] = userCats.splice(dragSrcCatIdx, 1);
      userCats.splice(targetIdx, 0, moved);
      categories = ['すべて', ...userCats];
      dragSrcCatIdx = null;
      if (currentUser) set(ref(db, `users/${currentUser.uid}/categories`), categories);
      renderCategories();
    };

    window.handleCatDragEnd = function(e) {
      e.currentTarget.classList.remove('dragging-item');

    function renderCategories() {
      const tabBar = document.getElementById('category-tabs');
      const selectEl = document.getElementById('post-category');
      const modalManageList = document.getElementById('modal-category-manage-list');
      const sidebarManageList = document.getElementById('sidebar-category-manage-list');

    window.renameCategory = async function(oldName) {
      const newName = prompt(`「${oldName}」の新しいタブ名を入力してください:`, oldName);
      if (!newName || !newName.trim() || newName.trim() === oldName) return;
      const trimmed = newName.trim();
      if (categories.includes(trimmed)) {
        alert('同じ名前のタブが既に存在します。');
        return;
      }

      categories = categories.map(c => c === oldName ? trimmed : c);
      if (currentCategory === oldName) currentCategory = trimmed;

      if (currentUser) {
        await set(ref(db, `users/${currentUser.uid}/categories`), categories);
        const updates = {};
        postsData.forEach(p => {
          if (p.category === oldName) {
            updates[`users/${currentUser.uid}/posts/${p.id}/category`] = trimmed;
          }
        });
        if (Object.keys(updates).length > 0) {
          await update(ref(db), updates);
        }
      }
      renderCategories();
      renderFeed();
    };

    window.deleteCategory = function(name) {
      if (!confirm(`タブ「${name}」を削除しますか？（投稿自体は削除されません）`)) return;
      categories = categories.filter(c => c !== name);
      if (currentCategory === name) currentCategory = 'すべて';
      if (currentUser) set(ref(db, `users/${currentUser.uid}/categories`), categories);
      renderCategories();
      renderFeed();

    // スマホでの左右スワイプによるタブ切り替え
    let touchStartX = 0;
    let touchStartY = 0;

    const swipeArea = document.getElementById('main-swipe-area');
    swipeArea.addEventListener('touchstart', (e) => {
      if (e.touches.length !== 1) return;
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }, { passive: true });

    swipeArea.addEventListener('touchend', (e) => {
      if (!e.changedTouches || e.changedTouches.length !== 1) return;
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;
      if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.8) {
        const curIdx = categories.indexOf(currentCategory);
        if (curIdx === -1) return;
        if (dx < 0 && curIdx < categories.length - 1) {
          selectCategory(categories[curIdx + 1]);
        } else if (dx > 0 && curIdx > 0) {
          selectCategory(categories[curIdx - 1]);
        }
      }
    }, { passive: true });

    // =========================================================================
    // 本家X（Twitter）の全文＆動画抽出・フォールバック再生・一括修復処理
    // =========================================================================
    function extractTweetId(url) {
      const m = (url || '').match(/(?:twitter\.com|x\.com)\/[A-Za-z0-9_]+\/status\/(\d+)/i);
      return m ? m[1] : null;
    }

    function extractFullTweetText(t) {
      if (!t) return '';
      const candidates = [
        t.raw_text?.text,
        t.note_tweet?.note_tweet_results?.result?.text,
        t.note_tweet?.text,
        t.full_text,
        t.text
      ].filter(s => typeof s === 'string' && s.trim().length > 0);

      let longest = candidates.sort((a, b) => b.length - a.length)[0] || '';

      if (t.article) {
        const artTitle = t.article.title ? `【${t.article.title}】\n\n` : '';
        let artBody = '';
        if (Array.isArray(t.article.content?.blocks)) {
          artBody = t.article.content.blocks.map(b => b.text || '').join('\n\n');
        } else if (typeof t.article.content === 'string') {
          artBody = t.article.content;
        } else if (typeof t.article.preview_text === 'string') {
          artBody = t.article.preview_text;
        }
        if ((artTitle + artBody).trim().length > longest.length) {
          longest = (artTitle + artBody).trim();
        }
      }
      return longest;
    }

    function extractTweetMedia(t) {
      const photos = [];
      const videos = [];
      const seenPhotoUrls = new Set();
      const seenVideoUrls = new Set();

      const addPhoto = (url) => {
        if (url && typeof url === 'string' && !seenPhotoUrls.has(url)) {
          seenPhotoUrls.add(url);
          photos.push({ url });
        }
      };

      const addVideo = (vObj) => {
        if (!vObj) return;
        let bestUrl = vObj.url || '';
        if (Array.isArray(vObj.variants)) {
          const mp4s = vObj.variants
            .filter(vr => vr && vr.url && (vr.content_type === 'video/mp4' || /\.mp4(\?|$)/i.test(vr.url)))
            .sort((a, b) => (b.bitrate || 0) - (a.bitrate || 0));
          if (mp4s.length > 0) bestUrl = mp4s[0].url;
        }
        if (bestUrl && !seenVideoUrls.has(bestUrl)) {
          seenVideoUrls.add(bestUrl);
          videos.push({
            url: bestUrl,
            thumbnail_url: vObj.thumbnail_url || vObj.poster || vObj.thumb || '',
            type: vObj.type || 'video'
          });
        }
      };

      if (t.media) {
        (t.media.photos || []).forEach(p => addPhoto(p.url));
        (t.media.videos || []).forEach(v => addVideo(v));
        (t.media.all || []).forEach(m => {
          if (m.type === 'photo' || m.type === 'image') addPhoto(m.url);
          else if (m.type === 'video' || m.type === 'gif' || m.type === 'animated_gif') addVideo(m);
        });
      }
      if (Array.isArray(t.media_extended)) {
        t.media_extended.forEach(m => {
          if (m.type === 'image' || m.type === 'photo') addPhoto(m.url);
          else if (m.type === 'video' || m.type === 'gif' || m.type === 'animated_gif') addVideo(m);
        });
      }
      if (Array.isArray(t.video?.variants)) {
        addVideo(t.video);
      }

      return { photos, videos };
    }

    function mergeBestSnapshot(snapA, snapB) {
      if (!snapA) return snapB;
      if (!snapB) return snapA;
      const bestText = (snapB.text || '').length > (snapA.text || '').length ? snapB.text : snapA.text;
      const bestVideos = (snapA.media?.videos?.length || 0) >= (snapB.media?.videos?.length || 0)
        ? snapA.media?.videos
        : snapB.media?.videos;
      const bestPhotos = (snapA.media?.photos?.length || 0) >= (snapB.media?.photos?.length || 0)
        ? snapA.media?.photos
        : snapB.media?.photos;

      return {
        ...snapA,
        text: bestText,
        media: {
          photos: bestPhotos || [],
          videos: bestVideos || []
        },
        quote: mergeBestSnapshot(snapA.quote, snapB.quote),
        schemaVersion: CURRENT_SCHEMA_VERSION,
        savedAt: Date.now()
      };
    }

    function sanitizeTweetSnapshot(t) {
      if (!t) return null;
      const rawId = String(t.id || t.tweetID || '');
      const screenName = t.author?.screen_name || t.user_screen_name || 'user';
      return {
        id: rawId,
        url: t.url || t.tweetURL || `[https://x.com/$](https://x.com/$){screenName}/status/${rawId}`,
        text: extractFullTweetText(t),
        created_timestamp: t.created_timestamp || t.date_epoch || null,
        author: {
          name: t.author?.name || t.user_name || 'X User',
          screen_name: screenName,
          avatar_url: t.author?.avatar_url || t.user_profile_image_url || DEFAULT_AVATAR
        },
        media: extractTweetMedia(t),
        quote: (t.quote || t.qrt) ? sanitizeTweetSnapshot(t.quote || t.qrt) : null,
        schemaVersion: CURRENT_SCHEMA_VERSION,
        savedAt: Date.now()
      };
    }

    async function fetchTweetData(tweetId, forceRefresh = false) {
      const cached = tweetCache[tweetId];
      if (cached && cached.schemaVersion === CURRENT_SCHEMA_VERSION && !forceRefresh) {
        return cached;
      }

      let fxSnap = null;
      let vxSnap = null;

      try {
        const res = await fetch(`[https://api.fxtwitter.com/status/$](https://api.fxtwitter.com/status/$){tweetId}`);
        if (res.ok) {
          const data = await res.json();
          if (data && data.tweet) fxSnap = sanitizeTweetSnapshot(data.tweet);
        }
      } catch (e) {}

      try {
        const res2 = await fetch(`[https://api.vxtwitter.com/Twitter/status/$](https://api.vxtwitter.com/Twitter/status/$){tweetId}`);
        if (res2.ok) {
          const data2 = await res2.json();
          if (data2 && (data2.tweetID || data2.text)) vxSnap = sanitizeTweetSnapshot(data2);
        }
      } catch (e2) {}

      const finalSnapshot = mergeBestSnapshot(fxSnap, vxSnap);
      if (finalSnapshot) {
        tweetCache[tweetId] = finalSnapshot;
        if (currentUser) {
          set(ref(db, `users/${currentUser.uid}/tweetSnapshots/${tweetId}`), finalSnapshot);
          if (finalSnapshot.quote && finalSnapshot.quote.id) {
            tweetCache[finalSnapshot.quote.id] = finalSnapshot.quote;
            set(ref(db, `users/${currentUser.uid}/tweetSnapshots/${finalSnapshot.quote.id}`), finalSnapshot.quote);
          }
        }
        return finalSnapshot;
      }

      return cached || null;
    }

    window.forceRefreshSingleTweet = async function(tweetId, e) {
      if (e) e.stopPropagation();
      if (!tweetId) return;
      showToast('𝕏 ツイートの全文・動画データを再取得中...');
      const updated = await fetchTweetData(tweetId, true);
      if (updated) {
        if (currentUser) {
          const dbUpdates = {};
          postsData.forEach(p => {
            if (p.tweetSnapshots && p.tweetSnapshots[tweetId]) {
              dbUpdates[`users/${currentUser.uid}/posts/${p.id}/tweetSnapshots/${tweetId}`] = updated;
            }
            if (p.quotedExternalSnapshot && String(p.quotedExternalSnapshot.id) === String(tweetId)) {
              dbUpdates[`users/${currentUser.uid}/posts/${p.id}/quotedExternalSnapshot`] = updated;
            }
            (p.blocks || []).forEach((b, idx) => {
              if (b.type === 'embed' && extractTweetId(b.url) === String(tweetId)) {
                dbUpdates[`users/${currentUser.uid}/posts/${p.id}/blocks/${idx}/tweetSnapshot`] = updated;
              }
            });
          });
          if (Object.keys(dbUpdates).length > 0) {
            await update(ref(db), dbUpdates);
          }
        }
        renderFeed();
        showToast('全文・動画データを最新状態に更新しました');
      } else {
        showToast('再取得に失敗しました');
      }
    };

    window.refreshAllTweetsInApp = async function() {
      const allTweetIds = new Set();
      postsData.forEach(p => {
        if (p.quotedExternalUrl) {
          const tid = extractTweetId(p.quotedExternalUrl);
          if (tid) allTweetIds.add(tid);
        }
        (p.blocks || []).forEach(b => {
          if (b.type === 'embed' && b.url) {
            const tid = extractTweetId(b.url);
            if (tid) allTweetIds.add(tid);
          } else if (b.type === 'text') {
            const raw = (b.content || '') + ' ' + (b.html || '');
            const matches = [...raw.matchAll(/https?:\/\/(?:twitter\.com|x\.com)\/[A-Za-z0-9_]+\/status\/(\d+)/gi)];
            matches.forEach(m => allTweetIds.add(m[1]));
          }
        });
      });

      if (allTweetIds.size === 0) {
        showToast('更新対象のXツイートリンクが見つかりませんでした');
        return;
      }

      showToast(`${allTweetIds.size}件のXツイート全文＆動画データを再取得中...`);
      for (const tid of allTweetIds) {
        await forceRefreshSingleTweet(tid, null);
      }
      showToast(`全${allTweetIds.size}件のXツイートを更新しました！`);
    };

    window.handleDirectVideoError = function(videoEl, rawUrl, tweetId, containerId) {
      const step = Number(videoEl.getAttribute('data-retry-step') || '0');
      if (step === 0 && tweetId) {
        videoEl.setAttribute('data-retry-step', '1');
        videoEl.src = `[https://d.fxtwitter.com/i/status/$](https://d.fxtwitter.com/i/status/$){tweetId}.mp4`;
        videoEl.load();
        return;
      }
      if (step === 1 && tweetId) {
        videoEl.setAttribute('data-retry-step', '2');
        videoEl.src = `[https://d.vxtwitter.com/i/status/$](https://d.vxtwitter.com/i/status/$){tweetId}.mp4`;

        return;
      }
      if (tweetId && containerId) {
        switchToOfficialTwitterPlayer(containerId, tweetId, null);

    function buildNativeTweetCardHtml(t, isQuoted = false, parentContextKey = 'root') {

      const cardKey = `${parentContextKey}_${t.id || 'tw'}_${isQuoted ? 'q' : 'm'}`.replace(/[^a-zA-Z0-9_-]/g, '_');

        ? new Date(t.created_timestamp * 1000).toLocaleString('ja-JP', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })
        : '';

      const rawText = t.text || '';
      const lineCount = rawText.split('\n').length;
      const isLongTweet = rawText.length > 140 || lineCount >= 5;
      const isExpanded = expandedTweetCardIds.has(cardKey);
      const shouldCollapse = isLongTweet && !isExpanded;

      const escapedText = rawText
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')

      const quoteHtml = (t.quote && !isQuoted) ? buildNativeTweetCardHtml(t.quote, true, cardKey) : '';

        <div class="${isQuoted ? 'mt-2.5 p-3 rounded-xl bg-white/[0.03]' : 'my-2 p-3.5 rounded-2xl theme-card'} border theme-border transition">
          <div class="flex items-center justify-between gap-2 mb-1.5">

                <span class="theme-sub truncate">@${t.author?.screen_name || ''}</span>

              <a href="${t.url || `[https://x.com/i/status/$](https://x.com/i/status/$){t.id}`}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()" class="text-[11px] theme-sub hover:text-white px-2 py-0.5 rounded-full border theme-border" title="本家Xで開く">𝕏 ↗</a>
            </div>
          </div>

          <div class="whitespace-pre-wrap post-text leading-relaxed ${shouldCollapse ? 'post-collapsed' : ''}">${escapedText}</div>

          ${isLongTweet ? `
            <button onclick="toggleExpandTweetCard('${cardKey}', event)" class="mt-1.5 mb-1 text-xs font-bold theme-accent-text hover:underline flex items-center gap-1">
              <span>${shouldCollapse ? `さらに表示（全文 ${rawText.length}文字）` : '折りたたむ'}</span>
            </button>
          ` : ''}

          ${renderTweetMediaGrid(t.media, t.id, cardKey)}

    function buildInternalQuoteCardHtml(qPost, isModalPreview = false) {

        return `<div class="my-2 p-3 rounded-2xl border theme-border bg-white/[0.02] text-xs theme-sub">（引用元のポストは削除されました）</div>`;

      });

        .filter(b => b.type === 'text')
        .map(b => b.content || htmlToPlainText(b.html || ''))

      const cardKey = `internal_quote_${qPost.id}`;
      const isLong = plainText.length > 140 || plainText.split('\n').length >= 5;

    window.hydrateTweetCards = async function() {

      for (const node of nodes) {
        node.setAttribute('data-loaded', 'true');
        const tid = node.getAttribute('data-tweet-id');
        const fallbackUrl = node.getAttribute('data-tweet-url');
        const ctxKey = node.getAttribute('data-ctx-key') || 'card';

        if (tweet) {
          node.innerHTML = buildNativeTweetCardHtml(tweet, false, ctxKey);

          wrapper.innerHTML = controls;
          const richDiv = document.createElement('div');
          richDiv.contentEditable = "true";
          richDiv.className = "rich-editor-box rich-content w-full bg-transparent outline-none min-h-[95px] py-1";
          richDiv.setAttribute('data-placeholder', 'いまどうしてる？（ChatGPTやGeminiの回答を貼り付けると、文字サイズ・太字・表までそのまま再現されます）');

          if (block.html && block.html.trim()) {
            const safeHtml = cleanRichHtml(block.html);
            richDiv.innerHTML = safeHtml;
            editorBlocks[idx].html = safeHtml;
          } else if (block.content) {
            if (hasMarkdownSyntax(block.content) && window.marked) {
              const parsed = cleanRichHtml(window.marked.parse(block.content));
              richDiv.innerHTML = parsed;
              editorBlocks[idx].html = parsed;
            } else {
              richDiv.innerText = block.content;
            }
          }

          richDiv.addEventListener('focus', () => { activeBlockIndex = idx; });
          richDiv.addEventListener('click', () => { activeBlockIndex = idx; });
          richDiv.addEventListener('keyup', () => { activeBlockIndex = idx; });

          richDiv.addEventListener('input', () => {
            activeBlockIndex = idx;
            editorBlocks[idx].html = cleanRichHtml(richDiv.innerHTML);
            editorBlocks[idx].content = htmlToPlainText(richDiv.innerHTML);
            updateCharCount();
          });

          richDiv.addEventListener('paste', async (e) => {
            activeBlockIndex = idx;
            const clip = e.clipboardData;
            if (!clip) return;

            const items = Array.from(clip.items || []);
            const imageItems = items.filter(item => item.type.startsWith('image/'));
            if (imageItems.length > 0) {
              e.preventDefault();
              e.stopPropagation();
              for (const item of imageItems) {
                const file = item.getAsFile();
                if (file) {
                  const dataUrl = await compressImage(file);
                  insertBlockAtCursor({ id: crypto.randomUUID(), type: 'image', url: dataUrl, caption: '' });
                }
              }
              return;
            }

            const htmlData = clip.getData('text/html');
            const textData = clip.getData('text/plain');

            e.preventDefault();
            e.stopPropagation();

            let htmlToInsert = '';

            if (textData && hasMarkdownSyntax(textData) && window.marked) {
              // 1. Markdown構文が含まれる場合はMarkdownパーサーを最優先（余計なUIゴミが入らないため最も綺麗）
              htmlToInsert = cleanRichHtml(window.marked.parse(textData));
            } else if (htmlData && htmlData.trim()) {
              // 2. 画面選択コピーによるリッチHTML（iframeやボタン等のノイズを完全除去して挿入）
              htmlToInsert = cleanRichHtml(htmlData);
            } else if (textData) {
              // 3. 通常のプレーンテキスト
              htmlToInsert = textData
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/\r?\n/g, '<br>');
            }

            if (htmlToInsert) {
              document.execCommand('insertHTML', false, htmlToInsert);
              editorBlocks[idx].html = cleanRichHtml(richDiv.innerHTML);
              editorBlocks[idx].content = htmlToPlainText(richDiv.innerHTML);
              updateCharCount();
            }
          });

          wrapper.appendChild(richDiv);
        } else if (block.type === 'image') {
          wrapper.innerHTML = controls + `
            <img src="${block.url}" class="max-h-64 rounded-lg object-contain mx-auto my-1">
            <input type="text" placeholder="キャプション（任意）" value="${block.caption || ''}"
              oninput="updateBlockCaption(${idx}, this.value)"
              class="w-full mt-1 bg-transparent text-xs theme-sub border-b border-transparent focus:border-gray-600 outline-none">
          `;
        } else if (block.type === 'embed') {
          wrapper.innerHTML = controls + renderMediaHtml(block.url, block.tweetSnapshot, `editor_${idx}`) + `
            <input type="text" placeholder="キャプション・メモ（任意）" value="${block.caption || ''}"
              oninput="updateBlockCaption(${idx}, this.value)"
              class="w-full mt-1 bg-transparent text-xs theme-sub border-b border-transparent focus:border-gray-600 outline-none">
          `;
        }
        container.appendChild(wrapper);
      });

      updateCharCount();
      safeCreateIcons();
      hydrateTweetCards();
    };

    function updateCharCount() {
      const total = editorBlocks
        .filter(b => b.type === 'text')
        .reduce((sum, b) => {
          const txt = b.content || htmlToPlainText(b.html || '');
          return sum + txt.length;
        }, 0);
      const el = document.getElementById('char-count');
      if (el) el.textContent = `${total.toLocaleString()} 文字`;
    }

    function insertBlockAtCursor(mediaBlock) {
      const target = editorBlocks[activeBlockIndex];
      if (target && target.type === 'text') {
        const hasContent = (target.content && target.content.trim().length > 0) || (target.html && target.html.trim().length > 0);
        if (!hasContent) {
          editorBlocks.splice(activeBlockIndex, 1, mediaBlock, { id: crypto.randomUUID(), type: 'text', content: '', html: '' });
          activeBlockIndex = Math.min(activeBlockIndex + 1, editorBlocks.length - 1);
        } else {
          editorBlocks.splice(activeBlockIndex + 1, 0, mediaBlock, { id: crypto.randomUUID(), type: 'text', content: '', html: '' });
          activeBlockIndex = Math.min(activeBlockIndex + 2, editorBlocks.length - 1);
        }
      } else {
        editorBlocks.push(mediaBlock);
        editorBlocks.push({ id: crypto.randomUUID(), type: 'text', content: '', html: '' });
        activeBlockIndex = editorBlocks.length - 1;
      }
      renderEditor();
    }

    async function compressImage(file, maxDim = 1200) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            let w = img.width, h = img.height;
            if (w > maxDim || h > maxDim) {
              if (w > h) { h = Math.round(h * (maxDim / w)); w = maxDim; }
              else { w = Math.round(w * (maxDim / h)); h = maxDim; }
            }
            const canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/webp', 0.82));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    document.getElementById('photo-input').addEventListener('change', async (e) => {
      const files = Array.from(e.target.files || []);
      for (const file of files) {
        const dataUrl = await compressImage(file);
        insertBlockAtCursor({ id: crypto.randomUUID(), type: 'image', url: dataUrl, caption: '' });
      }
      e.target.value = '';
    });

    window.addEventListener('paste', async (e) => {
      const modalOpen = !document.getElementById('post-modal').classList.contains('hidden');
      if (!modalOpen) return;
      if (e.target && e.target.isContentEditable) return;
      const items = Array.from(e.clipboardData?.items || []);
      const imageItems = items.filter(item => item.type.startsWith('image/'));
      if (imageItems.length === 0) return;

      e.preventDefault();
      for (const item of imageItems) {
        const file = item.getAsFile();
        if (file) {
          const dataUrl = await compressImage(file);
          insertBlockAtCursor({ id: crypto.randomUUID(), type: 'image', url: dataUrl, caption: '' });
        }
      }
    });

    window.insertUrlBlock = async function() {
      const url = prompt("挿入したいURL（本家XのツイートURL・Webサイト・YouTube・動画mp4・画像URL）を入力してください:");
      if (!url || !url.trim()) return;
      let formatted = url.trim();
      if (!/^https?:\/\//i.test(formatted) && !formatted.startsWith('data:')) {
        formatted = 'https://' + formatted;
      }
      const tid = extractTweetId(formatted);
      let tweetSnapshot = null;
      if (tid) {
        tweetSnapshot = await fetchTweetData(tid, true);
      }
      insertBlockAtCursor({ id: crypto.randomUUID(), type: 'embed', url: formatted, caption: '', tweetSnapshot });
    };

    window.addTextBlock = function() {
      editorBlocks.push({ id: crypto.randomUUID(), type: 'text', content: '', html: '' });
      activeBlockIndex = editorBlocks.length - 1;
      renderEditor();
    };

    window.moveBlock = function(idx, dir) {
      const target = idx + dir;
      if (target < 0 || target >= editorBlocks.length) return;
      [editorBlocks[idx], editorBlocks[target]] = [editorBlocks[target], editorBlocks[idx]];
      renderEditor();
    };

    window.removeBlock = function(idx) {
      editorBlocks.splice(idx, 1);
      if (editorBlocks.length === 0) editorBlocks.push({ id: crypto.randomUUID(), type: 'text', content: '', html: '' });
      renderEditor();
    };

    window.updateBlockCaption = function(idx, val) {
      if (editorBlocks[idx]) editorBlocks[idx].caption = val;
    };

    window.savePost = async function() {
      if (!currentUser) return;
      const title = document.getElementById('post-title').value.trim();
      const category = document.getElementById('post-category').value || 'メモ';
      const cleanedBlocks = editorBlocks.map(b => {
        if (b.type === 'text' && b.html) {
          return { ...b, html: cleanRichHtml(b.html), content: htmlToPlainText(b.html) };
        }
        return b;
      }).filter(b => {
        if (b.type !== 'text') return true;
        const plain = (b.content || htmlToPlainText(b.html || '')).trim();
        const hasTable = (b.html || '').includes('<table');
        return plain.length > 0 || hasTable;
      });
      if (!title && cleanedBlocks.length === 0 && !quotedPostId && !quotedExternalUrl) return;

      const embeddedSnapshots = {};
      for (const b of cleanedBlocks) {
        if (b.type === 'embed' && b.url) {
          const tid = extractTweetId(b.url);
          if (tid) {
            const snap = await fetchTweetData(tid);
            if (snap) {
              b.tweetSnapshot = snap;
              embeddedSnapshots[tid] = snap;
            }
          }
        } else if (b.type === 'text') {
          const raw = (b.content || '') + ' ' + (b.html || '');
          const matches = [...raw.matchAll(/https?:\/\/(?:twitter\.com|x\.com)\/[A-Za-z0-9_]+\/status\/(\d+)/gi)];
          for (const m of matches) {
            const tid = m[1];
            const snap = await fetchTweetData(tid);
            if (snap) embeddedSnapshots[tid] = snap;
          }
        }
      }

      let quotedExternalSnapshot = null;
      if (quotedExternalUrl) {
        const qTid = extractTweetId(quotedExternalUrl);
        if (qTid) {
          quotedExternalSnapshot = await fetchTweetData(qTid);
        }
      }

      const payload = {
        title,
        category,
        blocks: cleanedBlocks,
        quotedPostId: quotedPostId || null,
        quotedExternalUrl: quotedExternalUrl || null,
        quotedExternalSnapshot: quotedExternalSnapshot || null,
        tweetSnapshots: Object.keys(embeddedSnapshots).length > 0 ? embeddedSnapshots : null,
        updatedAt: Date.now()
      };

      if (editingPostId) {
        await update(ref(db, `users/${currentUser.uid}/posts/${editingPostId}`), payload);
      } else {
        const newRef = push(ref(db, `users/${currentUser.uid}/posts`));
        await set(newRef, {
          ...payload,
          parentId: replyParentId || null,
          createdAt: Date.now(),
          pinned: false,
          bookmarked: false
        });
      }
      closePostModal();
    };

    function renderMediaHtml(url, savedSnapshot = null, contextKey = 'media') {
      const safeUrl = (url || '').trim();
      const tweetId = extractTweetId(safeUrl);
      if (tweetId) {
        const snap = (savedSnapshot && savedSnapshot.schemaVersion === CURRENT_SCHEMA_VERSION)
          ? savedSnapshot
          : (tweetCache[tweetId] && tweetCache[tweetId].schemaVersion === CURRENT_SCHEMA_VERSION ? tweetCache[tweetId] : null);

        if (snap) {
          tweetCache[tweetId] = snap;
          return buildNativeTweetCardHtml(snap, false, contextKey);
        }
        setTimeout(() => window.hydrateTweetCards && window.hydrateTweetCards(), 10);
        return `<div data-tweet-id="${tweetId}" data-tweet-url="${safeUrl}" data-ctx-key="${contextKey}" class="my-2 p-4 rounded-2xl border theme-border theme-card text-xs theme-sub animate-pulse">𝕏 ポスト全文＆動画データを取得中...</div>`;
      }
      const ytMatch = safeUrl.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/shorts\/)([A-Za-z0-9_-]{11})/);
      if (ytMatch) {
        return `<div class="aspect-video w-full rounded-xl overflow-hidden my-2 border theme-border">
          <iframe src="[https://www.youtube.com/embed/$](https://www.youtube.com/embed/$){ytMatch[1]}" class="w-full h-full" allowfullscreen></iframe>
        </div>`;
      }
      if (/\.(mp4|webm|ogg|mov)(\?.*)?$/i.test(safeUrl)) {
        const directBoxId = `direct_vid_${contextKey}`.replace(/[^a-zA-Z0-9_-]/g, '_');
        return `<div id="${directBoxId}" class="my-2 rounded-xl overflow-hidden border theme-border bg-black" onclick="event.stopPropagation()">
          <video src="${safeUrl}" controls playsinline preload="metadata"
            class="w-full max-h-96 mx-auto bg-black block"></video>
        </div>`;
      }
      if (/\.(jpg|jpeg|png|gif|webp|svg|bmp|avif)(\?.*)?$/i.test(safeUrl) || safeUrl.startsWith('data:image/')) {
        return `<img src="${safeUrl}" referrerpolicy="no-referrer" onclick="event.stopPropagation(); openLightbox('${safeUrl}')" class="max-h-96 rounded-xl object-contain my-2 cursor-zoom-in">`;
      }
      let hostname = safeUrl;
      try { hostname = new URL(safeUrl).hostname; } catch (e) {}
      const favicon = `[https://www.google.com/s2/favicons?domain=$](https://www.google.com/s2/favicons?domain=$){encodeURIComponent(hostname)}&sz=64`;
      return `
        <a href="${safeUrl}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()" class="block my-2 p-3.5 rounded-2xl border theme-border theme-card hover:bg-white/[0.04] transition group">
          <div class="flex items-center gap-3">
            <img src="${favicon}" class="w-9 h-9 rounded-lg bg-white/10 p-1.5 object-contain shrink-0" onerror="this.style.display='none'">
            <div class="min-w-0 flex-1">
              <div class="text-xs theme-sub truncate flex items-center gap-1">
                <span>🔗 ${hostname}</span>
              </div>
              <div class="text-sm font-bold theme-accent-text group-hover:underline truncate mt-0.5">${safeUrl}</div>
            </div>
            <span class="text-xs theme-sub group-hover:text-white shrink-0">↗</span>
          </div>
        </a>
      `;
    }

    window.toggleExpandPost = function(id, e) {
      if (e) e.stopPropagation();
      if (expandedPostIds.has(id)) {
        expandedPostIds.delete(id);
      } else {
        expandedPostIds.add(id);
      }
      renderFeed();
    };

    window.copyPostText = async function(id, e) {
      if (e) e.stopPropagation();
      const post = postsData.find(p => p.id === id);
      if (!post) return;
      const parts = [];
      if (post.title) parts.push(post.title);
      (post.blocks || []).forEach(b => {
        if (b.type === 'text') {
          const txt = b.content || htmlToPlainText(b.html || '');
          if (txt) parts.push(txt);
        } else if (b.type === 'embed' && b.url) {
          parts.push(b.url);
        }
      });
      if (post.quotedExternalUrl) parts.push(post.quotedExternalUrl);
      const textToCopy = parts.join('\n\n');
      try {
        await navigator.clipboard.writeText(textToCopy);
        showToast('ポストをコピーしました');
      } catch (err) {
        const ta = document.createElement('textarea');
        ta.value = textToCopy;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast('ポストをコピーしました');
      }
    };

    function buildPostItemHtml(post, isChild = false, hasNextSibling = false, replyCount = 0, quoteCount = 0) {
      const dateStr = new Date(post.createdAt || Date.now()).toLocaleString('ja-JP', {
        month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
      });

      if (post.tweetSnapshots) {
        Object.entries(post.tweetSnapshots).forEach(([tid, snap]) => {
          if (!tweetCache[tid] && snap?.schemaVersion === CURRENT_SCHEMA_VERSION) {
            tweetCache[tid] = snap;
          }
        });
      }
      if (post.quotedExternalSnapshot && post.quotedExternalSnapshot.id && post.quotedExternalSnapshot.schemaVersion === CURRENT_SCHEMA_VERSION) {
        tweetCache[post.quotedExternalSnapshot.id] = post.quotedExternalSnapshot;
      }

      const isPostExpanded = expandedPostIds.has(post.id);

      let hasLongTextInPost = false;
      const blocksHtml = (post.blocks || []).map((b, bIdx) => {
        if (b.type === 'text') {
          const rawPlain = b.content || htmlToPlainText(b.html || '');
          const isThisBlockLong = rawPlain.length > 220 || rawPlain.split('\n').length >= 7;
          if (isThisBlockLong) hasLongTextInPost = true;
          const collapseThisText = isThisBlockLong && !isPostExpanded;

          const inlineSource = (b.content || '') + ' ' + (b.html || '');
          const inlineTweetMatches = [...inlineSource.matchAll(/https?:\/\/(?:twitter\.com|x\.com)\/[A-Za-z0-9_]+\/status\/(\d+)[^\s<"']*/gi)];
          const seenTids = new Set();
          const inlineTweetCards = inlineTweetMatches.map((m, mIdx) => {
            const tid = m[1];
            if (seenTids.has(tid)) return '';
            seenTids.add(tid);
            const savedSnap = post.tweetSnapshots?.[tid] || tweetCache[tid] || null;
            return renderMediaHtml(m[0], savedSnap, `post_${post.id}_in_${bIdx}_${mIdx}`);
          }).join('');

          const formattedHtml = renderFormattedBlockContent(b);

          return `
            <div class="${collapseThisText ? 'post-collapsed' : ''}">
              ${formattedHtml}
            </div>
            ${collapseThisText ? `
              <button onclick="toggleExpandPost('${post.id}', event)" class="mt-1 mb-1 text-xs font-bold theme-accent-text hover:underline block">
                さらに表示（全文 ${rawPlain.length}文字）
              </button>
            ` : ''}
            ${inlineTweetCards}
          `;
        }
        if (b.type === 'image') {
          return `<figure class="my-2">
            <img src="${b.url}" onclick="event.stopPropagation(); openLightbox('${b.url}')" class="max-h-96 rounded-2xl border theme-border object-contain cursor-zoom-in">

          </figure>`;
        }
        if (b.type === 'embed') {
          return `<div class="my-2">${renderMediaHtml(b.url, b.tweetSnapshot, `post_${post.id}_emb_${bIdx}`)}
            ${b.caption ? `<div class="text-xs theme-sub mt-1">${b.caption}</div>` : ''}
          </div>`;
        }
        return '';
      }).join('');

      let quotedCardHtml = '';
      if (post.quotedPostId) {
        const qPost = postsData.find(p => p.id === post.quotedPostId);
        quotedCardHtml = buildInternalQuoteCardHtml(qPost, false);
      } else if (post.quotedExternalUrl) {
        quotedCardHtml = renderMediaHtml(post.quotedExternalUrl, post.quotedExternalSnapshot, `post_${post.id}_quote`);

      return `
        <div id="post-item-${post.id}"

             onclick="${isSelectMode ? `togglePostSelection('${post.id}', event)` : ''}"
             class="flex gap-3 ${isChild ? 'pt-3' : ''} rounded-xl transition ${isSelectMode ? 'cursor-pointer' : ''} ${isSelected ? 'bg-sky-500/10 ring-1 ring-sky-500/40 p-2 -m-2' : ''}">
          
          ${isSelectMode ? `
            <div class="pt-2 shrink-0">
              <div class="w-5 h-5 rounded-md border flex items-center justify-center transition ${isSelected ? 'theme-accent-bg border-transparent text-white' : 'border-gray-500 bg-black/40'}">
                ${isSelected ? `<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/></svg>` : ''}
              </div>
            </div>
          ` : ''}

          <div class="flex flex-col items-center shrink-0">
            <img src="${profileData.avatar || DEFAULT_AVATAR}" class="w-10 h-10 rounded-full object-cover border theme-border">
            ${hasNextSibling ? `<div class="w-0.5 flex-1 bg-zinc-800 my-1"></div>` : ''}
          </div>
          <div class="flex-1 min-w-0">
            ${post.pinned && !isChild ? `
              <div class="flex items-center gap-1.5 text-[11px] theme-sub font-bold mb-1">
                <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M16 9V4l1 0c.55 0 1-.45 1-1s-.45-1-1-1H7c-.55 0-1 .45-1 1s.45 1 1 1l1 0v5c0 1.66-1.34 3-3 3v2h5.97v7l1 1 1-1v-7H19v-2c-1.66 0-3-1.34-3-3z"/></svg>
                <span>固定されたポスト</span>
              </div>
            ` : ''}

            <div class="flex items-center justify-between text-xs theme-sub mb-1">
              <div class="flex items-center gap-1.5 flex-wrap">
                <span class="font-bold text-[14px]" style="color: var(--text-main)">${profileData.name}</span>
                <span>${profileData.handle}</span>
                <span>· ${dateStr}</span>
                ${post.category ? `<span class="px-2 py-0.5 rounded-full bg-white/5 border theme-border text-[10px]">${post.category}</span>` : ''}
              </div>
            </div>

            ${post.title ? `<h3 class="font-bold text-base mb-1">${post.title}</h3>` : ''}

            <div>
              ${blocksHtml}
            </div>

            ${hasLongTextInPost && isPostExpanded ? `
              <button onclick="toggleExpandPost('${post.id}', event)" class="mt-1 text-xs font-bold theme-accent-text hover:underline block">
                折りたたむ
              </button>
